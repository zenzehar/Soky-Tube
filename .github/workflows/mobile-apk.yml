name: Soky Tube mobile preview APK

on:
  push:
    branches:
      - 'feature/mobile-touch-android-*'
      - 'feature/mobile-v4-native-layout-*'
      - 'feature/mobile-v5-responsive-controls-settings-*'
      - 'feature/mobile-v6-touch-polish-*'
      - 'feature/mobile-v7-youtube-settings-pip-media-*'
      - 'feature/mobile-v7-4-*'
      - 'fix/mobile-v7-5-*'
      - 'fix/mobile-v7-6-*'
      - 'fix/mobile-v7-7-*'
      - 'feature/mobile-v7-8-*'
      - 'fix/mobile-v7-9-*'
      - 'fix/mobile-v7-10-*'
  workflow_dispatch:

concurrency:
  group: soky-mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with Git submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install project Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;21.0.6113669"
      - name: Test responsive phone and tablet sizing
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileUiSizingTest"
      - name: Test null-video duration regression
        run: |
          ./gradlew --no-daemon --stacktrace :common:testStbetaDebugUnitTest --tests "*ExoPlayerControllerDurationTest"
      - name: Test PiP dismiss and fullscreen lifecycle
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobilePipLifecyclePolicyTest"
      - name: Test full-screen PiP morph geometry
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobilePipMorphGeometryTest"
      - name: Test finger drag, flick and phone safe areas
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobilePipDragMathTest" --tests "*MobileSystemBarsTest"
      - name: Test lock screen and Home-to-PiP lifecycle
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileScreenTransitionPolicyTest"
      - name: Test exact double-tap seeking and boundary clamping
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileDoubleTapSeekPolicyTest"
      - name: Build installable debug-signed mobile APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleStmobileDebug
      - name: Stage APKs
        run: |
          mkdir -p dist
          cp smarttubetv/build/outputs/apk/stmobile/debug/*_universal.apk dist/SokyTube_Mobile_preview_universal.apk
          cp smarttubetv/build/outputs/apk/stmobile/debug/*_arm64-v8a.apk dist/SokyTube_Mobile_preview_arm64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SokyTube-mobile-preview
          path: dist/
          if-no-files-found: error
      - name: Publish installable preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-preview-v7-10-mobile-signin-touch-seek-20261107 dist/*.apk dist/SHA256SUMS.txt \
            --title "Soky Tube Mobile v7.10 - Phone Sign-In, Large Controls and Double-Tap Effects (7 Nov 2026)" \
            --notes "v7.10: replace QR-first TV-like login on handheld with phone browser-first secure verification code flow and optional QR for another device, copy code on tap, preserve original account polling/auth backend; enlarge touch player controls to 54-70 dp targets and responsive compact 56 dp play; add original YouTube-like left/right curved shaded double-tap ±10-second seek feedback with animated arrows and seconds, avoid first-tap control flicker. All mobile changes only, retain v7.9 PiP/lockscreen recovery and v7.8 You tab. Physical phone tests still required." \
            --prerelease --target "$GITHUB_SHA" \
          || gh release upload mobile-preview-v7-10-mobile-signin-touch-seek-20261107 dist/*.apk dist/SHA256SUMS.txt --clobber
