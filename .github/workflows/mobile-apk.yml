name: Soky Tube mobile preview APK

on:
  push:
    branches:
      - 'feature/mobile-touch-android-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with Git submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install project Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;21.0.6113669"
      - name: Build installable debug-signed mobile APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleStmobileDebug
      - name: Stage APKs
        run: |
          mkdir -p dist
          cp smarttubetv/build/outputs/apk/stmobile/debug/*_universal.apk dist/SokyTube_Mobile_preview_universal.apk
          cp smarttubetv/build/outputs/apk/stmobile/debug/*_arm64-v8a.apk dist/SokyTube_Mobile_preview_arm64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SokyTube-mobile-preview
          path: dist/
          if-no-files-found: error
      - name: Publish installable preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-preview-20261104 dist/*.apk dist/SHA256SUMS.txt \
            --title "Soky Tube Mobile - Touch Preview (4 Nov 2026)" \
            --notes "Touchscreen phone/tablet preview. Includes separate mobile app ID com.sokytube.mobile. Debug signed; Android device testing is still required. Do not install over an existing SmartTube app." \
            --prerelease --target "$GITHUB_SHA" \
          || gh release upload mobile-preview-20261104 dist/*.apk dist/SHA256SUMS.txt --clobber
