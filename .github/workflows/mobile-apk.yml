name: Soky Tube mobile preview APK

on:
  push:
    branches:
      - 'feature/mobile-touch-android-*'
      - 'feature/mobile-v4-native-layout-*'
      - 'feature/mobile-v5-responsive-controls-settings-*'
      - 'feature/mobile-v6-touch-polish-*'
      - 'feature/mobile-v7-youtube-settings-pip-media-*'
      - 'feature/mobile-v7-4-*'
      - 'fix/mobile-v7-5-*'
      - 'fix/mobile-v7-6-*'
      - 'fix/mobile-v7-7-*'
      - 'feature/mobile-v7-8-*'
      - 'fix/mobile-v7-9-*'
      - 'fix/mobile-v7-10-*'
      - 'fix/mobile-v7-11-*'
      - 'fix/mobile-v7-12-*'
      - 'fix/mobile-v7-13-*'
      - 'fix/mobile-v7-14-*'
      - 'fix/mobile-v7-15-*'
      - 'feature/mobile-v7-16-*'
      - 'feature/mobile-v7-17-*'
      - 'fix/mobile-v7-18-*'
  workflow_dispatch:

concurrency:
  group: soky-mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with Git submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install project Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;21.0.6113669"
      - name: Test responsive phone and tablet sizing
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileUiSizingTest"
      - name: Test null-video duration regression
        run: |
          ./gradlew --no-daemon --stacktrace :common:testStbetaDebugUnitTest --tests "*ExoPlayerControllerDurationTest"
      - name: Test PiP dismiss and fullscreen lifecycle
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobilePipLifecyclePolicyTest"
      - name: Test full-screen PiP morph geometry
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobilePipMorphGeometryTest"
      - name: Test finger drag, flick and phone safe areas
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobilePipDragMathTest" --tests "*MobileSystemBarsTest"
      - name: Test lock screen and Home-to-PiP lifecycle
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileScreenTransitionPolicyTest"
      - name: Test exact double-tap seeking and boundary clamping
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileDoubleTapSeekPolicyTest"
      - name: Test original and dubbed audio grouping
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileAudioTrackPolicyTest"
      - name: Test first fullscreen measured-surface recovery
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileRotationSurfacePolicyTest"
      - name: Test paused Android Auto media-session retention
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileCarPlaybackPolicyTest"
      - name: Test Android 12+ media button PendingIntent mutability
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileMediaButtonIntentPolicyTest"
      - name: Test screen-lock playback continuity policy
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileScreenLockPolicyTest"
      - name: Test general-interest Discover diversity and manual refresh only
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileDiscoveryMixerTest" --tests "*MobileDiscoveryRefreshPolicyTest"
      - name: Test minimize-to-PiP task removal protection
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobilePipServicePolicyTest"
      - name: Test Android Auto exact 10-second seek boundaries
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileCarSeekPolicyTest"
      - name: Test Android Auto cold resumption without unlocking phone
        run: |
          ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest --tests "*MobileCarResumePolicyTest"
      - name: Build installable debug-signed mobile APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleStmobileDebug
      - name: Stage APKs
        run: |
          mkdir -p dist
          cp smarttubetv/build/outputs/apk/stmobile/debug/*_universal.apk dist/SokyTube_Mobile_preview_universal.apk
          cp smarttubetv/build/outputs/apk/stmobile/debug/*_arm64-v8a.apk dist/SokyTube_Mobile_preview_arm64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SokyTube-mobile-preview
          path: dist/
          if-no-files-found: error
      - name: Publish installable preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-preview-v7-18-car-cold-resume-20261121 dist/*.apk dist/SHA256SUMS.txt \
            --title "Soky Tube Mobile v7.18 - Android Auto Locked-Phone Resume (21 Nov 2026)" \
            --notes "v7.18 fixes Android Auto Play being unresponsive when the phone remains locked, its player Activity is destroyed or a new car connection arrives after a long pause. Remembers the last non-incognito video and position locally; preserves a playable media browse item and implements an explicit user-initiated Play fallback inside a service-owned AUDIO-ONLY ExoPlayer. Resolves a fresh video stream, avoids waking the phone, and transfers MediaSession ownership cleanly when the phone Activity opens. No playback starts solely from car connection, preserving Android Auto requirements. Retains v7.17 Discover pull-only feed, PiP continuity and car +/-10-second media actions, and v7.16 screen-lock protections. Android Auto video on the car display is NOT implemented because ordinary media sessions do not support projected video and native parked video is not supported on general Android Auto devices. TV flavor unchanged. Device testing essential." \
            --prerelease --target "$GITHUB_SHA" \
          || gh release upload mobile-preview-v7-18-car-cold-resume-20261121 dist/*.apk dist/SHA256SUMS.txt --clobber
