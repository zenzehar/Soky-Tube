name: Soky Tube native Android Auto car probe APK

on:
  push:
    branches:
      - 'experiment/soky-direct-car-*'
      - 'experiment/soky-car-surface-check-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soky-car-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  car-probe-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with Git submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;21.0.6113669"
      - name: Build isolated car probe debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStcarDebug
      - name: Package APKs and checksums
        run: |
          mkdir -p dist
          cp smarttubetv/build/outputs/apk/stcar/debug/*_universal.apk dist/SokyTube_Car_Surface_universal.apk
          cp smarttubetv/build/outputs/apk/stcar/debug/*_arm64-v8a.apk dist/SokyTube_Car_Surface_arm64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: SokyTube-Android12-Surface-Check
          path: dist/
          retention-days: 14
          if-no-files-found: error
